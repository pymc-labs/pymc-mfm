[project]
name = "pymc-mfm"
version = "0.0.1"
description = "Graph-conditional Marketing Foundational Models."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PyMC Labs" }]
keywords = ["marketing mix modeling", "bayesian", "amortized inference", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "arviz-base>=1.3,<2",
    "arviz-stats[xarray]>=1.3,<2",
    "h5netcdf>=1.4",
    "h5py>=3.10",
    "httpx>=0.27,<1",
    "huggingface-hub>=1.0,<3",
    "matplotlib>=3.9",
    "mlflow>=3.10,<4",
    "numpy>=2.1,<3",
    "packaging>=24.2",
    "pandas>=2.2.3,<4",
    "plotly>=6,<8",
    "safetensors>=0.6.2,<1",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "torch>=2.6,<3",
    "xarray>=2024.10",
]

[project.urls]
Repository = "https://github.com/pymc-labs/pymc-mfm"
Issues = "https://github.com/pymc-labs/pymc-mfm/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]
# Website build (docs/). Quarto itself is a system tool; see README "Documentation site".
docs = [
    "quartodoc>=0.11.1,<0.12",
]
# Contributor tools for synthetic corpus generation and example notebooks.
generation = [
    "pymc-generator @ git+https://github.com/pymc-labs/pymc-generator.git@main",
]
examples = [
    "pymc-marketing>=1.1,<2",
    "ipython>=9,<10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_mfm"]

[tool.hatch.build.targets.sdist]
only-include = [
    ".dockerignore",
    ".github",
    ".gitignore",
    ".python-version",
    "AGENTS.md",
    "CLAUDE.md",
    "LICENSE",
    "README.md",
    "RELEASE.md",
    "benchmarks",
    "docs",
    "environment.yml",
    "examples",
    "pyproject.toml",
    "scripts",
    "skills",
    "src",
    "tests",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: long-running tests; CI runs these serially in a separate lane (-m slow)",
]
