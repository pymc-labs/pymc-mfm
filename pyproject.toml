[project]
name = "pymc-mfm"
version = "0.0.1.dev0"
description = "Graph-conditional Marketing Foundation Models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2.3,<4",
    "packaging>=24.2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# The base install is the light HTTP client. `local` runs the model in-process.
# Every extra that needs the model includes `local`, so `pymc-mfm[hub]` and the
# others keep installing PyTorch.
local = [
    "torch>=2.6,<3",
    "safetensors>=0.6.2,<1",
]
# Client extras: netCDF draws files and plots.
draws = [
    "xarray>=2024.10",
    "h5netcdf>=1.4",
    "h5py>=3.10",
]
plot = [
    "matplotlib>=3.9",
]
client = [
    "pymc-mfm[draws,plot]",
]
generation = [
    "pymc-mfm[local]",
    "pymc-generator @ git+https://github.com/pymc-labs/pymc-generator.git@main",
]
diagnostics = [
    "pymc-mfm[local]",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "arviz-stats>=1.3,<2",
]
arviz = [
    "pymc-mfm[local]",
    "arviz-stats[xarray]>=1.3,<2",
]
hub = [
    "pymc-mfm[local]",
    "huggingface-hub>=1.0,<2",
]
training = [
    "pymc-mfm[local]",
    "mlflow>=3.10,<4",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "arviz-stats>=1.3,<2",
]
examples = [
    "pymc-mfm[local]",
    "pymc-marketing>=1.1,<2",
    "ipython>=9,<10",
]

[project.urls]
Repository = "https://github.com/pymc-labs/pymc-mfm"
Issues = "https://github.com/pymc-labs/pymc-mfm/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9",
]
# Website build (docs/). Quarto itself is a system tool; see README "Documentation site".
docs = [
    "quartodoc>=0.11.1,<0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_mfm"]

[tool.hatch.build.targets.sdist]
only-include = [
    ".dockerignore",
    ".github",
    ".gitignore",
    ".python-version",
    "AGENTS.md",
    "CLAUDE.md",
    "README.md",
    "RELEASE.md",
    "benchmarks",
    "docs",
    "environment.yml",
    "examples",
    "pyproject.toml",
    "scripts",
    "skills",
    "src",
    "tests",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
