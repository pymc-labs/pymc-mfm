[project]
name = "pymc-mfm"
version = "0.0.1.dev0"
description = "Graph-conditional Marketing Foundation Models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "torch>=2.6,<3",
    "safetensors>=0.6.2,<1",
    "packaging>=24.2",
]

[project.optional-dependencies]
generation = [
    "pymc-generator @ git+https://github.com/pymc-labs/pymc-generator.git@main",
]
diagnostics = [
    "matplotlib>=3.9",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "arviz-stats>=1.3,<2",
]
arviz = [
    "arviz-stats[xarray]>=1.3,<2",
]
hub = [
    "huggingface-hub>=1.0,<2",
]
training = [
    "mlflow>=3.10,<4",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "arviz-stats>=1.3,<2",
]
examples = [
    "pymc-marketing>=1.1,<2",
]

[project.urls]
Repository = "https://github.com/pymc-labs/pymc-mfm"
Issues = "https://github.com/pymc-labs/pymc-mfm/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_mfm"]

[tool.hatch.build.targets.sdist]
only-include = [
    ".github",
    ".gitignore",
    ".python-version",
    "README.md",
    "RELEASE.md",
    "benchmarks",
    "environment.yml",
    "examples",
    "pyproject.toml",
    "src",
    "tests",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
