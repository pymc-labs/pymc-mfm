[project]
name = "pymc-mfm"
version = "0.0.1.dev0"
description = "Graph-conditional Marketing Foundation Models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "torch>=2.6",
]

[project.optional-dependencies]
generation = [
    "pymc-generator @ git+https://github.com/pymc-labs/pymc-generator.git@main",
]

[project.urls]
Repository = "https://github.com/pymc-labs/pymc-mfm"
Issues = "https://github.com/pymc-labs/pymc-mfm/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_mfm"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
