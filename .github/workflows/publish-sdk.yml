name: publish-sdk

# Builds the public `pymc-mfm` client package (wheel and sdist) from this repository's own files
# at the checked-out commit, and publishes it to PyPI by trusted publishing (no token, no secret).
# Run by hand only: Actions > publish-sdk > Run workflow. Use main to publish; any branch can
# do a dry run.
# Inputs: version (PyPI version, no "+" part) and dry_run (default true: build and check only,
# publish nothing).
# What goes in the package, and what it says about itself: packaging/client/.
#
# The build refuses a commit that still has a known defect (the guard in build_client_package.py).
# This workflow never passes --allow-known-defects.
#
# Two jobs:
#   build    no environment, no secret. It uploads the archives and the release manifest.
#   publish  environment "pypi": the PyPI pending publisher names this workflow file and this
#            environment. It runs only when dry_run is false and the ref is main.
# The `pypi` environment must exist, restricted to the main branch, before the first publish.
#
# Actions are pinned by commit sha because this workflow holds the publish step.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PyPI version of the package, for example 0.1.0 (no local +part)"
        required: true
        default: "0.1.0"
      dry_run:
        description: "Build and check only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install uv twine
      - name: Build, check and install-test the package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python packaging/client/build_client_package.py \
            --version "$VERSION" --out dist --manifest manifest/MANIFEST.txt \
            --check --check-python 3.11 --check-python 3.12 --check-python 3.13
          ls -l dist
          # The release manifest (every file and archive with its sha256) is also in the run summary.
      - name: Check the archives with the repository's boundary scanner
        run: python scripts/check_public_boundary.py --archive dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pymc-mfm-dist
          path: dist/
          if-no-files-found: error
      # The manifest stays out of dist/: the publish step uploads everything in dist/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pymc-mfm-manifest
          path: manifest/MANIFEST.txt
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.dry_run == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pymc-mfm-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          # Attestations are public, signed records on PyPI that name the source repository and
          # this workflow. The repository is private, so they stay off.
          attestations: false
