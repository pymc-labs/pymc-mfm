name: Public boundary

# Generic rules only: weights, large files, embedded payloads, foreign history, secrets, symlinks and
# private-link paths. Internal-name checks need the private deny file and run locally.

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      base-revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Check tracked files
        run: python3 scripts/check_public_boundary.py --tree
      - name: Check each commit introduced by the revision
        env:
          BASE_REVISION: ${{ inputs.base-revision }}
        run: python3 scripts/check_public_boundary.py --range "$BASE_REVISION..HEAD"
      - name: Build distributions
        run: uv build
      - name: Check built distributions
        run: python3 scripts/check_public_boundary.py --archive dist/*
