name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installation: [base, full]
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the native graph renderer
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes graphviz
      # "base" names the lane that runs the model with the default test tools; it needs the
      # `local` extra because the default install no longer includes PyTorch.
      - name: Install the local model runtime and test tools
        if: matrix.installation == 'base'
        run: uv sync --locked --extra local
      - name: Install complete integration extras
        if: matrix.installation == 'full'
        run: uv sync --locked --all-extras
      - name: Check formatting and lint
        if: matrix.installation == 'base'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Exercise local contracts without publication credentials
        run: uv run --no-sync pytest -q
      - name: Plant ignored local files the build must leave out
        if: matrix.installation == 'full'
        # The installed-distribution check rejects any of these in the sdist or wheels.
        run: touch src/pymc_mfm/canary.pt tests/canary.npz examples/.env.canary
      - name: Build distributable artifacts
        run: uv build
      - name: Verify installed sdist, base wheel, diagnostics-only wheel and arviz-only wheel
        if: matrix.installation == 'full'
        run: uv run --no-sync python .github/scripts/installed_smoke.py --work-dir artifacts/installed

  light:
    # The default install is a light client with no PyTorch. Run its tests in two
    # environments: the bare install, and the install with the client's extras.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "--extra client"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the client without PyTorch
        run: uv sync --locked ${{ matrix.extras }}
      - name: Check that PyTorch is absent and is not imported
        run: uv run --no-sync python .github/scripts/light_install_check.py
      - name: Test the client
        # --confcutdir keeps the model fixtures in tests/conftest.py, which import torch, out.
        run: uv run --no-sync pytest -q tests/client --confcutdir=tests/client
