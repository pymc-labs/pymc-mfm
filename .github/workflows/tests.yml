name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older run. Every push to main keeps its own result.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Check formatting and lint without installing the package
        run: |
          uv sync --locked --only-group dev
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository admin authorization for PR tests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BY: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          is_admin() {
            local permission
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission) || exit 1
            [[ $permission == admin ]]
          }
          # On a rerun, the requesting actor authorizes this same revision, not the PR author.
          if ! is_admin "$REQUESTED_BY" ||
             { [[ $GITHUB_RUN_ATTEMPT == 1 && $REQUESTED_BY != "$PR_AUTHOR" ]] && ! is_admin "$PR_AUTHOR"; }; then
            echo "::notice::Full tests need a repository admin. An admin can choose Re-run failed jobs after reviewing this revision."
            exit 1
          fi

  contracts:
    needs: authorize
    # Two lanes per install. "fast" is every test not marked slow. "slow" is the seven tests
    # marked slow (about 245 s serial). Together they run every test once per install, and
    # the two lanes run in parallel, so the critical path is the longer lane, not the sum.
    name: contracts (${{ matrix.installation }}, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Whole-job hang guard: the longest observed full lane took 30.3 min, serial.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        installation: [base, full]
        lane: [fast, slow]
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "false"
      # The fast lane's two xdist workers use the two vCPUs of a runner, one math thread
      # each. The slow lane runs serially on both threads: its notebook tests are single
      # long processes that took over 120 s when they shared the CPUs.
      OMP_NUM_THREADS: ${{ matrix.lane == 'slow' && '2' || '1' }}
      MKL_NUM_THREADS: ${{ matrix.lane == 'slow' && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the native graph renderer
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes graphviz
      # "base" names the lane that runs the model with the default test tools; it needs the
      # `local` extra because the default install no longer includes PyTorch.
      - name: Install the local model runtime and test tools
        if: matrix.installation == 'base'
        run: uv sync --locked --extra local
      - name: Install complete integration extras
        if: matrix.installation == 'full'
        run: uv sync --locked --all-extras
      # Static check of the deprecated top-level names; it only reads tests/typing.
      - name: Check static types of the deprecated top-level names
        if: matrix.installation == 'base' && matrix.lane == 'fast'
        run: uv run --no-sync pyright tests/typing
      # Each lane selects its marker expression explicitly; plain pytest runs all tests.
      - name: Exercise local contracts without publication credentials
        run: >-
          uv run --no-sync pytest -q ${{ matrix.lane == 'slow' && '-m slow' || '-n 2 --dist worksteal -m "not slow"' }}
          --durations=25 --junitxml=junit/contracts-${{ matrix.installation }}-${{ matrix.lane }}.xml
          --timeout=120
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-contracts-${{ matrix.installation }}-${{ matrix.lane }}
          path: junit/
          retention-days: 30

  installed-smoke:
    needs: authorize
    # Builds the sdist and wheels, then installs each into a clean environment. It needs no
    # test results, so it runs beside the test jobs.
    runs-on: ubuntu-latest
    # Whole-job hang guard: observed about 4 min.
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the native graph renderer
        # The installed workflow check renders diagnostic graphs.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes graphviz
      - name: Install complete integration extras
        run: uv sync --locked --all-extras
      - name: Plant ignored local files the build must leave out
        # The installed-distribution check rejects any of these in the sdist or wheels.
        run: touch src/pymc_mfm/canary.pt tests/canary.npz examples/.env.canary
      - name: Build distributable artifacts
        run: uv build
      - name: Verify installed sdist, base/local wheels, diagnostics-only wheel and arviz-only wheel
        run: uv run --no-sync python .github/scripts/installed_smoke.py --work-dir artifacts/installed

  light:
    needs: authorize
    # The default install is a light client with no PyTorch. Run its tests in two
    # environments: the bare install, and the install with the client's extras.
    runs-on: ubuntu-latest
    # Whole-job hang guard: observed under 1 min.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "--extra client"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the client without PyTorch
        run: uv sync --locked ${{ matrix.extras }}
      - name: Check that PyTorch is absent and is not imported
        run: uv run --no-sync python .github/scripts/light_install_check.py
      - name: Test the client
        # --confcutdir keeps the model fixtures in tests/conftest.py, which import torch, out.
        run: uv run --no-sync pytest -q tests/client --confcutdir=tests/client --durations=25 --junitxml=junit/light-${{ matrix.extras == '' && 'bare' || 'client' }}.xml --timeout=120
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-light-${{ matrix.extras == '' && 'bare' || 'client' }}
          path: junit/
          retention-days: 30

  # A required check must fail when authorization is missing or any test job did not pass.
  ci-ok:
    if: always()
    needs: [authorize, lint, contracts, installed-smoke, light]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          bad=0
          table="| job | result |"$'\n'"|---|---|"
          while IFS=$'\t' read -r job result; do
            table+=$'\n'"| $job | $result |"
            case "$result" in
              success) ;;
              *) bad=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$NEEDS_JSON")
          echo "$table"
          [ -z "${GITHUB_STEP_SUMMARY:-}" ] || echo "$table" >> "$GITHUB_STEP_SUMMARY"
          exit "$bad"
