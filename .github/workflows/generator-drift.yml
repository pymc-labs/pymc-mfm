name: Generator drift

# CI installs the pymc-generator commit pinned in uv.lock. This canary resolves
# the dependency's tracked branch instead, so a generator change that alters the
# A, B or evaluation shard plans shows up before anyone refreshes the lock.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-generator:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Resolve the generator's tracked branch
        run: |
          uv lock --upgrade-package pymc-generator
          uv sync --all-extras
      - name: Compare the shard-plan probes with the recorded arrays
        run: uv run --no-sync pytest -q tests/test_generator_drift.py

  report-failure:
    needs: latest-generator
    if: ${{ always() && github.event_name == 'schedule' && needs.latest-generator.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Generator drift failed"
          body="The scheduled generator-drift run failed: $RUN_URL"
          number=$(gh issue list --label generator-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            gh issue edit "$number" --add-assignee derwells
          else
            gh label create generator-drift --description "Scheduled generator-drift run failed" --color D93F0B || true
            gh issue create --title "$title" --body "$body" --label generator-drift --assignee derwells
          fi
