# Exceptions to scripts/check_public_boundary.py. Each entry needs a reason.
# `sha256` voids the entry when the file changes. A notebook with image outputs
# needs an entry with `sha256` (its image bytes are pinned). `pending` passes normal runs
# and fails `--release`.

[[allow]]
path = "examples/river_1_quickstart.ipynb"
rules = ["large-file", "embedded-payload"]
reason = "Fully executed synthetic-data quickstart with 14 inline PNG plots, including five Graphviz-style graph diagrams, the offline graph inspector, and printed DOT export examples. The notebook rule checks each image's structure and scans all other strings as text, but it cannot rule out hidden data in a valid image, so these exact reviewed bytes are pinned. Any rerun must update sha256 in the same pull request so the reviewer sees the new outputs. Malformed-image findings are never covered."
sha256 = "6b444392b4a20960db247c9e0d54a4df71dce1dd47bf683282b75770b3811fd0"
max_bytes = 4000000

