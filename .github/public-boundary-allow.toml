# Exceptions to scripts/check_public_boundary.py. Each entry needs a reason.
# `sha256` voids the entry when the file changes. A notebook with image outputs
# needs an entry with `sha256` (its image bytes are pinned). `pending` passes normal runs
# and fails `--release`.

[[allow]]
path = "examples/river_1_quickstart.ipynb"
rules = ["large-file", "embedded-payload"]
reason = "Fully executed synthetic-data quickstart with the pinned River-1 model: all 25 code cells ran, including the input-token example, and 14 inline PNG plots were regenerated. The notebook rule checks image structure and scans all other strings but cannot rule out hidden data, so these exact reviewed bytes are pinned. Any rerun must update sha256 in the same pull request. Malformed-image findings are never covered."
sha256 = "d5f16da727e8cdb8ab4284680311fc3bd434224d037cde0bd4e0cbd07e0f1cae"
max_bytes = 3000000

