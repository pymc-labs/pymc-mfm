<section class="mfm-river__hero" aria-labelledby="mfm-river-title">
  <!-- The Orinoco at night, one still picture; river.js draws it through the canvas above
       with moving water, light, cloud, mist and a glitch now and then. data-water is where
       the river is in the picture. -->
  <!-- Static sRGB approximation of river.js's grade() for this picture. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <filter id="mfm-river-still-grade" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix values="1.273 -0.438 0.023 0 -0.001
                             0.385  0.521 0.025 0  0.009
                             0.152 -0.015 1.016 0  0.027
                             0      0     0     1  0"/>
    </filter>
  </svg>
  <img class="mfm-river__picture" data-mfm="picture" src="../../assets/img/river/river-hero.webp" data-water="../../assets/img/river/river-hero-water.png" alt="" aria-hidden="true" decoding="async" fetchpriority="high">
  <canvas class="mfm-river__canvas" data-mfm="river" aria-hidden="true"></canvas>
  <div class="mfm-river__numbers" aria-hidden="true"></div>
  <div class="mfm-grain" aria-hidden="true"></div>
  <!-- Display type over the picture, not a heading: the page title ("River 1.0") is the one h1. -->
  <p id="mfm-river-title" class="mfm-river__title">River <span class="mfm-river__version">v1.0.0</span></p>
  <canvas class="mfm-river__veil" data-mfm="veil" aria-hidden="true"></canvas>
  <a class="mfm-river__scroll no-external" href="#title-block-header">Scroll to read<span aria-hidden="true"></span></a>
</section>
<script>
  // Quarto puts this block inside the article column. Lift it above the page columns so the
  // hero spans the full width and the sidebars start below it. Without scripts the hero
  // stays hidden (model.css) and the page keeps its own title.
  (() => {
    const hero = document.querySelector(".mfm-river__hero");
    const page = document.getElementById("quarto-content");
    if (!hero || !page) return;
    page.before(hero);
    document.body.classList.add("mfm-river-hero-on");
  })();
</script>
