project:
  type: website
  output-dir: _site
  # Copies examples/*.ipynb into guide/examples/ and writes the API reference
  # pages with quartodoc. Both outputs are generated and ignored by Git.
  pre-render: _scripts/prepare.py
  # Leaves the page title as the only <h1> on each page (see the script).
  post-render: _scripts/finish.py
  render:
    - "*.qmd"
    - "guide/**"
    - "api/**"
    - "reference/**"
    - "models/**"
    - "migration.md"
  resources:
    - assets/js/*.js
    - assets/fonts/*
    - assets/img/show/*.svg
    - assets/img/logo/*.svg
    - assets/favicon/*
    # The share image (Open Graph and X cards) and the old blog addresses, which now redirect
    # to the PyMC Labs blog.
    - assets/img/social/*
    - blog/index.html
    - blog/posts/*/index.html
    # Phosphor Regular icons (MIT, @phosphor-icons/core 2.1.1), drawn as CSS masks.
    - assets/icons/phosphor/*
    # The River 1.0 hero's picture and the map of its water (models/river-1/_hero.html).
    - assets/img/river/*

# Both written during pre-render: the Python reference sidebar (quartodoc) and the
# HTTP API sidebar (_scripts/http_pages.py). Quarto picks the sidebar that lists a page.
metadata-files:
  - reference/_sidebar.yml
  - api/_sidebar.yml

website:
  title: "PyMC MFM"
  description: "Marketing Foundational Models by PyMC Labs: pretrained Bayesian media mix models that return each channel's contribution with uncertainty, without refitting per dataset."
  # No trailing slash: Quarto joins site-url and a site path such as /assets/... with no
  # slash of its own, so a trailing slash here gives a doubled slash in share-image URLs.
  # docs/_scripts/mount.py replaces it with the host's address (--site-url) when it lays
  # out the site, so the site's own links open in the same tab and share images resolve.
  site-url: https://pymc-labs.github.io/pymc-mfm
  repo-url: https://github.com/pymc-labs/pymc-mfm
  favicon: assets/favicon/favicon.svg
  bread-crumbs: false
  page-navigation: true
  back-to-top-navigation: false
  # A magnifier button ("/" or Ctrl/Cmd+K opens it) for Quarto's search sheet. site.css shows
  # it only on Guide and API pages, next to the dark-mode button and the access link.
  # assets/js/search.js adds the result path lines and the empty-results message.
  search:
    location: navbar
    type: overlay
    keyboard-shortcut: ["/"]
  # Share image for every page. The path starts at the site root ("/"); without it, Quarto
  # resolves the image under the folder of each page. Quarto prefixes site-url.
  open-graph:
    image: /assets/img/social/mfm-social.jpg
    image-width: 1200
    image-height: 630
    image-alt: "PyMC MFM: Train once, decompose many."
  twitter-card:
    card-style: summary_large_image
    image: /assets/img/social/mfm-social.jpg
    image-width: 1200
    image-height: 630
    image-alt: "PyMC MFM: Train once, decompose many."
  navbar:
    # The MFM mark alone, in navy; site.css renders it soft white on dark backgrounds.
    logo: assets/img/logo/mfm-logo-navy.svg
    logo-alt: "PyMC MFM home"
    title: false
    collapse-below: lg
    # The bar stays on screen while the page scrolls under it (glass, site.css).
    pinned: true
    left:
      - text: Docs
        href: guide/index.qmd
      # "API": the Python reference for the client and the library. The HTTP API pages
      # (api/) are still built, but no menu links them: testers use the Python client.
      - text: API
        href: reference/index.qmd
      # A dropdown straight to each model. assets/js/site.js opens it on hover and makes
      # the "Models" label itself go to the Models page; a trailing " NEW" becomes a badge,
      # and a text-only item ending in " SOON" a greyed "Coming soon" entry (models/upcoming.yml).
      # Items with only `text` are column headers; "---" starts the second column.
      - text: Models
        menu:
          - text: "Models"
          - text: "River NEW"
            href: models/river-1/index.qmd
          - text: "Sea SOON"
          - text: "Ocean SOON"
          - text: "---"
          - text: "Resources"
          - text: "All models"
            href: models/index.qmd
          - text: "White paper"
            href: https://www.pymc-labs.com/white-papers/marketing-foundation-models
      # pymc-labs.com, which carries the PyMC Labs blog too: MFM has no blog of its own.
      - text: PyMC Labs
        href: https://www.pymc-labs.com
      # The commercial way in: the PyMC Labs contact form.
      - text: Contact us
        href: https://www.pymc-labs.com/contact
    right:
      # On wide screens site.css draws the GitHub icon as a square (the label stays for
      # screen readers); the phone menu shows icon and label.
      - text: GitHub
        icon: github
        href: https://github.com/pymc-labs/pymc-mfm
      # Access is by invitation. This link goes to the page that says how it works. site.js marks
      # the last link of this list as the action button, so keep it last.
      - text: "Get access"
        href: guide/index.qmd#hosted-api
  sidebar:
    - id: guide
      title: Guide
      style: floating
      collapse-level: 2
      contents:
        - section: Get started
          contents:
            - guide/index.qmd
            - guide/concepts.qmd
            - migration.md
        - section: Use a model
          contents:
            - guide/decompose.qmd
            - guide/models-hub.qmd
            - guide/http-api.qmd
        - section: Train
          contents:
            - guide/training.qmd
        # River's page is a docs page too, so it carries this sidebar.
        - section: Models
          contents:
            - text: River 1.0
              href: models/river-1/index.qmd
        - section: Examples
          # Every notebook in examples/ (copied here at pre-render), titled by its first heading.
          contents: "guide/examples/*.ipynb"
  # One quiet line. The dark-mode button is in the navbar (Quarto's own toggle, site.css).
  page-footer:
    left: |
      Built by [PyMC Labs](https://www.pymc-labs.com), the creators of PyMC.

language:
  search-text-placeholder: "Search"

quartodoc:
  package: pymc_mfm
  title: Python reference
  dir: reference
  sidebar: reference/_sidebar.yml
  # Docstrings are reStructuredText prose (``literals``, :mod: roles).
  parser: sphinx
  renderer:
    style: markdown
    table_style: description-list
    show_signature_annotations: true
  sections:
    - title: Python workflow
      desc: Load a model, run inference and inspect the same results on any engine.
      contents:
        - load
        - name: Model
          members:
            - inference
            - response_curves
            - result
            - idata
            - plot
            - network
        - name: Result
          members:
            - idata
            - plot
        - ModelBusy
        - NotSupported
    - title: River API client
      desc: The client for the hosted River API. It does not import PyTorch.
      contents:
        - client.Client
        # The class behind client.datasets; pymc_mfm.client does not export it.
        - client.datasets.Datasets
        - client.Dataset
        - client.Analysis
        - client.AnalysisStatus
        - client.Preview
        - client.scenario
        - client.amount
        - client.grid
        - client.curve
        - client.ApiError
        - client.Unauthorized
        - client.ValidationError
        - client.NotReady
        - client.Gone
        - client.RateLimited
        - client.NotFound
        - client.ServerError
        - client.ApiConnectionError
    - title: Load and share models
      desc: Read model folders and Hugging Face Hub profiles; write and publish your own.
      contents:
        - inference.from_pretrained
        - inference.list_profiles
        - inference.save_pretrained
        - inference.push_to_hub
    - title: The model
      desc: One shared encoder, a joint graph router and a graph-conditioned decoder.
      contents:
        - name: model.MFM
          members:
            - input_usage
            - inference
            - predict
            - idata
            - query_result
            - plot
            - response_curves
            - compile_sampling
            - disable_compiled_sampling
            - sampling_status
            - predict_batch
        - model.ModelConfig
    - title: Charts
      desc: Sampling-free matplotlib or plotly charts of a model's latest complete inference.
      contents:
        - name: plotting.Plots
          members:
            - inputs
            - fit
            - contributions_over_time
            - shares
            - contribution_totals
            - contribution_vs_media
            - response_curves
        - plotting.set_backend
        - name: inference.curves.ResponseCurves
          members:
            - to_frame
    - title: Model trees as files
      desc: Check a model tree, save it to a netCDF file without overwriting, and load it without PyTorch.
      contents:
        - idata.validate_idata
        - idata.save_idata
        - idata.load_idata
    - title: Inference
      desc: Array-level decomposition, results and warm-up for long-running processes.
      contents:
        - inference.decompose
        - inference.observation_batch
        - inference.DecompositionResult
        - inference.warm_up_sampling
        - inference.warm_up_observations
    - title: Training
      desc: Train an amortized network on simulated corpora.
      contents:
        - training.train
        - training.TrainingConfig
        - training.TrackingConfig
        - training.TrainingResult
        - training.TrainingError
        - training.load_checkpoint
        - training.save_checkpoint
        - training.CorpusStream
    - title: Diagnostics
      desc: Score draws against simulated truth and check calibration.
      contents:
        - diagnostics.Diagnostics
        - diagnostics.ResultPlots
        - diagnostics.Comparison
        - diagnostics.calibration_summary
        - diagnostics.sbc_report
        - diagnostics.build_report
    - title: Graph inspection
      desc: Marginal and individual graphs, offline inspection and Graphviz DOT export.
      contents:
        - plotting.plot_dag
        - name: plotting.GraphvizGraph
          members:
            - render
            - savefig
        - plotting.graph_to_dot
        - plotting.plot_graph_inspector
        - name: plotting.GraphInspector
          members:
            - save

format:
  html:
    # Dark is the default (it is listed first); the navbar button switches to light and
    # remembers the choice.
    theme:
      dark: [cosmo, assets/styles/dark.scss]
      light: [cosmo, assets/styles/light.scss]
    css:
      - assets/fonts/fonts.css
      - assets/styles/site.css
    filters:
      - _scripts/site-head.lua
    toc: true
    toc-depth: 3
    toc-title: On this page
    code-copy: true
    code-overflow: scroll
    # Code colours in the site palette (derived from the GitHub themes; see the files).
    highlight-style:
      light: assets/styles/mfm-light.theme
      dark: assets/styles/mfm-dark.theme
    link-external-icon: false
    link-external-newwindow: true
    smooth-scroll: false
    anchor-sections: true
    fig-responsive: true

execute:
  # Notebooks and posts render with their stored outputs; nothing runs at build time.
  enabled: false
