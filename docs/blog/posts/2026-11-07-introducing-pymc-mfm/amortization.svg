<svg class="mfm-fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="amz-t amz-d"><title id="amz-t">Fit per dataset versus one network trained once</title><desc id="amz-d">Two workflows, one above the other. Top: datasets A, B and C each go through their own fit to produce draws. Bottom: simulated worlds train one network once, and the trained network infers new datasets A, B and C.</desc><style>
.mfm-fig{--f-ink:var(--mfm-ink,#0c1f40);--f-ink2:var(--mfm-ink-2,#4d5b78);--f-accent:var(--mfm-accent,#2650c8);--f-t1:var(--mfm-tone-1,#f1f4fa);--f-t2:var(--mfm-tone-2,#e3e9f4);--f-bg:var(--mfm-bg,#fff);--f-on-solid:#fff;--f-on-accent:#fff;font-family:var(--mfm-font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:400}
.mfm-fig text{fill:var(--f-ink);font-size:15px}
.mfm-fig .mf-h{font-size:17px;font-weight:500}
.mfm-fig .mf-sub{fill:var(--f-ink2);font-size:14px}
.mfm-fig .mf-panel{fill:var(--f-t1)}
.mfm-fig .mf-box{fill:var(--f-t2)}
.mfm-fig .mf-solid{fill:var(--f-ink)}
.mfm-fig .mf-accent{fill:var(--f-accent)}
.mfm-fig text.mf-on-solid{fill:var(--f-on-solid)}
.mfm-fig text.mf-on-accent{fill:var(--f-on-accent)}
.mfm-fig .mf-arrow{fill:none;stroke:var(--f-ink2);stroke-width:1.5}
.mfm-fig .mf-head{fill:var(--f-ink2)}
.mfm-fig .mf-mid{text-anchor:middle}
</style><rect class="mf-panel" x="0" y="0" width="600" height="236" rx="12"/><text class="mf-h" x="24" y="38">A model for each dataset</text><text class="mf-sub" x="24" y="60">Every new dataset needs its own fit.</text><rect class="mf-box" x="24" y="80" width="150" height="38" rx="8"/><text class="mf-mid " x="99.0" y="104.0">Dataset A</text><path class="mf-arrow" d="M174 99L219 99"/><path class="mf-head" d="M224 99l-7 -4.5v9z"/><rect class="mf-solid" x="230" y="80" width="150" height="38" rx="8"/><text class="mf-mid mf-on-solid" x="305.0" y="104.0">Fit model</text><path class="mf-arrow" d="M380 99L425 99"/><path class="mf-head" d="M430 99l-7 -4.5v9z"/><rect class="mf-box" x="436" y="80" width="140" height="38" rx="8"/><text class="mf-mid " x="506.0" y="104.0">Draws</text><rect class="mf-box" x="24" y="130" width="150" height="38" rx="8"/><text class="mf-mid " x="99.0" y="154.0">Dataset B</text><path class="mf-arrow" d="M174 149L219 149"/><path class="mf-head" d="M224 149l-7 -4.5v9z"/><rect class="mf-solid" x="230" y="130" width="150" height="38" rx="8"/><text class="mf-mid mf-on-solid" x="305.0" y="154.0">Fit model</text><path class="mf-arrow" d="M380 149L425 149"/><path class="mf-head" d="M430 149l-7 -4.5v9z"/><rect class="mf-box" x="436" y="130" width="140" height="38" rx="8"/><text class="mf-mid " x="506.0" y="154.0">Draws</text><rect class="mf-box" x="24" y="180" width="150" height="38" rx="8"/><text class="mf-mid " x="99.0" y="204.0">Dataset C</text><path class="mf-arrow" d="M174 199L219 199"/><path class="mf-head" d="M224 199l-7 -4.5v9z"/><rect class="mf-solid" x="230" y="180" width="150" height="38" rx="8"/><text class="mf-mid mf-on-solid" x="305.0" y="204.0">Fit model</text><path class="mf-arrow" d="M380 199L425 199"/><path class="mf-head" d="M430 199l-7 -4.5v9z"/><rect class="mf-box" x="436" y="180" width="140" height="38" rx="8"/><text class="mf-mid " x="506.0" y="204.0">Draws</text><rect class="mf-panel" x="0" y="256" width="600" height="264" rx="12"/><text class="mf-h" x="24" y="294">One network, trained once</text><text class="mf-sub" x="24" y="316">Then it reads every new dataset without a fit.</text><rect class="mf-box" x="24" y="338" width="150" height="52" rx="8"/><text class="mf-mid " x="99.0" y="369.0">Simulated worlds</text><path class="mf-arrow" d="M174 364L219 364"/><path class="mf-head" d="M224 364l-7 -4.5v9z"/><rect class="mf-solid" x="230" y="338" width="150" height="52" rx="8"/><text class="mf-mid mf-on-solid" x="305.0" y="362.0">Train network</text><text class="mf-mid mf-sub mf-on-solid" x="305.0" y="379.0" style="font-size:13px">once</text><path class="mf-arrow" d="M380 364L425 364"/><path class="mf-head" d="M430 364l-7 -4.5v9z"/><rect class="mf-accent" x="436" y="338" width="140" height="52" rx="8"/><text class="mf-mid mf-on-accent" x="506.0" y="369.0">Trained network</text><path class="mf-arrow" d="M506 390V428"/><path class="mf-arrow" d="M99 428H506"/><path class="mf-arrow" d="M99 428V461"/><path class="mf-head" d="M99 466l-4.5 -7h9z"/><path class="mf-arrow" d="M305 428V461"/><path class="mf-head" d="M305 466l-4.5 -7h9z"/><path class="mf-arrow" d="M506 428V461"/><path class="mf-head" d="M506 466l-4.5 -7h9z"/><text class="mf-sub" x="24" y="420" style="font-size:13px">Infers many</text><rect class="mf-box" x="31" y="468" width="136" height="40" rx="8"/><text class="mf-mid " x="99.0" y="493.0">New dataset A</text><rect class="mf-box" x="237" y="468" width="136" height="40" rx="8"/><text class="mf-mid " x="305.0" y="493.0">New dataset B</text><rect class="mf-box" x="438" y="468" width="136" height="40" rx="8"/><text class="mf-mid " x="506.0" y="493.0">New dataset C</text></svg>
