# The pilot site: only the path of an invited tester, who uses the hosted River API from
# Python. `quarto render docs --profile pilot` writes it to docs/_site-pilot/. Quarto merges
# this file over _quarto.yml instead of _quarto-full.yml.
#
# Pages: the landing page, Get started, the client guide and the Python reference, one page
# with every class and function of the client. In this profile, _scripts/prepare.py joins
# the client reference into reference/index.qmd, and writes no HTTP API pages and no example
# notebooks. The old reference/client.*.html addresses are redirect pages (pilot_post.py). Text that only the full site carries is in
# `.content-hidden when-profile="pilot"` blocks; text only for the pilot is in
# `.content-visible when-profile="pilot"` blocks.
project:
  # A separate folder, so no page of a full build is left in the pilot site.
  output-dir: _site-pilot
  # A page's `pilot-description` replaces its `description` in the built page.
  post-render: _scripts/pilot_post.py
  render:
    - index.qmd
    - guide/index.qmd
    - guide/python-client.qmd
    - reference/index.qmd

website:
  navbar:
    left:
      - text: Docs
        href: guide/index.qmd
      - text: PyMC Labs
        href: https://www.pymc-labs.com
        target: _blank
        rel: noopener
    right:
      # The invitation links to the console; this is the way back. A path on the same host, so
      # the same build serves staging and production.
      - text: Sign in
        href: /console/
  # One sidebar for the three docs pages (the reference page names it in its metadata).
  sidebar:
    - id: guide
      style: floating
      contents:
        - text: Get started
          href: guide/index.qmd
        - text: Use the River API from Python
          href: guide/python-client.qmd
        - text: Python reference
          href: reference/index.qmd

format:
  html:
    # Links to a per-object reference page go to its anchor on the one page.
    filters:
      - _scripts/pilot-links.lua
    # Every level 2 and 3 entry of "On this page" shows at all times, not only the section in view.
    toc-expand: true
